version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: showcase_backend
    restart: always
    environment:
      - TZ=Asia/Tehran
    networks:
      - showcase_net

  frontend:
    build:
      context: ./frontend
    container_name: showcase_frontend
    restart: always
    environment:
      - TZ=Asia/Tehran
    networks:
      - showcase_net

  nginx:
    image: nginx:1.27-alpine
    container_name: showcase_nginx
    restart: always
    ports:
      - "8501:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - showcase_net

networks:
  showcase_net:
    driver: bridge
